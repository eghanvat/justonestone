<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>Buy one stone </title>
</head>
<body id="page">
  <div class="stone-wrapper">
      <img src="s.png" id="top-center-img" description="1 billion dollar stone" />
    <h3 class="stone-text"> $ 1 billion </h3>
  </div>
  
  <div class="bottom-button-container">
    <button class="btn btn-primary" onClick="goBack();">Back</button>
    <button class="btn btn-secondary" onclick="window.location.href='/conditions.html';">Can Buy</button>
  </div>
  
  <script> 
  function goBack() {
    if (document.referrer !== "") {
      window.history.back();
    } else {
      window.location.href = "http://www.google.com";
    }
  }
  </script>

        
</body>
