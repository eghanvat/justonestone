  <div id="fullscreenOverlay" class="overlay"> <span class="close-btn">&times;</span> <img id="overlayImg" src="" alt="Enlarged View"> </div>
  
  <div class="bottom-button-container">
    <button class="btn btn-primary" onClick="goBack();"> Back </button>
  </div>
  
  <script> 
  function goBack() {
    if (document.referrer !== "") {
      window.history.go(-4);
    } else {
      window.location.href = "http://www.google.com";
    }
  }
  
  // Get DOM elements
const overlay = document.getElementById('fullscreenOverlay');
const overlayImg = document.getElementById('overlayImg');
const closeBtn = document.querySelector('.close-btn');
const images = document.querySelectorAll('.clickable-img');

// Open overlay on click
images.forEach(img => {
  img.addEventListener('click', (e) => {
    overlay.style.display = 'flex'; // Uses flex layout to center perfectly
    overlayImg.src = e.target.src; // Dynamically grab source image
  });
});

// Close overlay on clicking 'X'
closeBtn.addEventListener('click', () => {
  overlay.style.display = 'none';
});

// Close overlay on clicking anywhere outside the image
overlay.addEventListener('click', (e) => {
  if (e.target !== overlayImg && e.target !== closeBtn) {
    overlay.style.display = 'none';
  }
});

  </script>
